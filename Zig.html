<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZipChat 💬</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #FF6B6B;
    --c2: #FFD93D;
    --c3: #6BCB77;
    --c4: #4D96FF;
    --c5: #C77DFF;
    --bg: #0F0E17;
    --surface: #1A1928;
    --surface2: #242338;
    --text: #FFFFFE;
    --text2: #A7A9BE;
    --radius: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  /* ── ANIMATED BACKGROUND ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 10% 20%, rgba(255,107,107,.12) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 90% 80%, rgba(77,150,255,.12) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 50% 50%, rgba(199,125,255,.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── AUTH SCREEN ── */
  #auth-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    background: var(--bg);
    flex-direction: column;
    gap: 24px;
    padding: 20px;
  }

  .auth-card {
    background: var(--surface);
    border-radius: 28px;
    padding: 40px 36px;
    width: 100%; max-width: 400px;
    border: 1.5px solid rgba(255,255,255,.07);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: slideUp .5s cubic-bezier(.16,1,.3,1);
  }

  @keyframes slideUp {
    from { opacity:0; transform: translateY(30px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .auth-logo {
    font-family: 'Pacifico', cursive;
    font-size: 2.4rem;
    background: linear-gradient(135deg, var(--c1), var(--c2), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-align: center; margin-bottom: 6px;
  }

  .auth-sub {
    text-align: center; color: var(--text2); font-size: .9rem; margin-bottom: 28px;
  }

  .auth-tabs {
    display: flex; gap: 8px; margin-bottom: 24px;
    background: var(--surface2); border-radius: 14px; padding: 4px;
  }

  .auth-tab {
    flex: 1; padding: 10px; border: none; border-radius: 11px;
    font-family: 'Nunito', sans-serif; font-size: .9rem; font-weight: 700;
    cursor: pointer; transition: all .25s; color: var(--text2); background: transparent;
  }

  .auth-tab.active {
    background: linear-gradient(135deg, var(--c4), var(--c5));
    color: #fff;
    box-shadow: 0 4px 14px rgba(77,150,255,.35);
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block; font-size: .8rem; font-weight: 700;
    color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em;
  }

  .form-group input {
    width: 100%; padding: 12px 16px;
    background: var(--surface2); border: 1.5px solid rgba(255,255,255,.08);
    border-radius: 12px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: .95rem;
    outline: none; transition: border-color .2s;
  }

  .form-group input:focus { border-color: var(--c4); }

  .avatar-picker { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

  .av-opt {
    width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid transparent;
    cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
    transition: all .2s; background: var(--surface2);
  }

  .av-opt.selected { border-color: var(--c4); transform: scale(1.15); box-shadow: 0 0 0 4px rgba(77,150,255,.2); }

  .btn-primary {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--c4), var(--c5));
    border: none; border-radius: 14px; color: #fff;
    font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800;
    cursor: pointer; transition: all .2s; margin-top: 8px;
    box-shadow: 0 6px 20px rgba(77,150,255,.3);
  }

  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(77,150,255,.4); }
  .btn-primary:active { transform: translateY(0); }

  #auth-error {
    color: var(--c1); font-size: .85rem; text-align: center;
    margin-top: 8px; min-height: 20px;
  }

  /* ── MAIN APP ── */
  #app {
    display: none; height: 100vh; position: relative; z-index: 1;
  }

  #app.visible { display: flex; }

  .sidebar {
    width: 280px; min-width: 280px;
    background: var(--surface);
    border-right: 1px solid rgba(255,255,255,.06);
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }

  .sidebar-header {
    padding: 20px 18px 14px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }

  .logo {
    font-family: 'Pacifico', cursive; font-size: 1.5rem;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .my-profile {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    cursor: pointer;
  }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; flex-shrink: 0; position: relative;
  }

  .avatar.sm { width: 34px; height: 34px; font-size: 1.1rem; }
  .avatar.lg { width: 46px; height: 46px; font-size: 1.5rem; }

  .status-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--surface); background: var(--c3);
  }

  .status-dot.offline { background: var(--text2); }

  .profile-info { flex: 1; min-width: 0; }
  .profile-name { font-weight: 800; font-size: .95rem; }
  .profile-status { font-size: .78rem; color: var(--text2); }

  .sidebar-section {
    padding: 10px 18px 6px;
    font-size: .72rem; font-weight: 900; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text2);
  }

  .users-list { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  .users-list::-webkit-scrollbar { width: 4px; }
  .users-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }

  .user-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; cursor: pointer;
    border-left: 3px solid transparent;
    transition: all .2s;
  }

  .user-item:hover { background: rgba(255,255,255,.04); }

  .user-item.active {
    background: rgba(77,150,255,.1);
    border-left-color: var(--c4);
  }

  .user-item .unread {
    margin-left: auto;
    background: var(--c1);
    color: #fff; font-size: .7rem; font-weight: 800;
    padding: 2px 7px; border-radius: 20px; min-width: 20px; text-align: center;
  }

  .no-users {
    padding: 20px 18px; color: var(--text2); font-size: .88rem; text-align: center; line-height: 1.6;
  }

  /* ── CHAT AREA ── */
  .chat-area {
    flex: 1; display: flex; flex-direction: column; height: 100vh;
    background: var(--bg); overflow: hidden;
  }

  .chat-header {
    padding: 14px 22px; display: flex; align-items: center; gap: 14px;
    background: rgba(26,25,40,.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }

  .chat-header-info { flex: 1; }
  .chat-header-name { font-weight: 800; font-size: 1rem; }
  .chat-header-status { font-size: .78rem; color: var(--text2); }
  .chat-header-status.online { color: var(--c3); }

  .chat-placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: var(--text2);
  }

  .chat-placeholder .big-emoji { font-size: 4rem; }
  .chat-placeholder p { font-size: 1rem; font-weight: 600; }
  .chat-placeholder span { font-size: .85rem; }

  .messages-container {
    flex: 1; overflow-y: auto; padding: 20px 22px;
    display: flex; flex-direction: column; gap: 6px;
  }

  .messages-container::-webkit-scrollbar { width: 5px; }
  .messages-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 5px; }

  .msg-group { display: flex; flex-direction: column; gap: 3px; }

  .msg-row {
    display: flex; align-items: flex-end; gap: 8px;
    animation: msgIn .25s cubic-bezier(.16,1,.3,1);
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg-row.mine { flex-direction: row-reverse; }

  .msg-bubble {
    max-width: 62%; padding: 10px 16px;
    border-radius: 18px; font-size: .93rem; line-height: 1.5;
    word-break: break-word; position: relative;
  }

  .msg-row.mine .msg-bubble {
    background: linear-gradient(135deg, var(--c4), var(--c5));
    color: #fff;
    border-bottom-right-radius: 5px;
  }

  .msg-row.theirs .msg-bubble {
    background: var(--surface2);
    color: var(--text);
    border-bottom-left-radius: 5px;
  }

  .msg-time {
    font-size: .68rem; color: var(--text2); padding: 0 4px; white-space: nowrap;
    align-self: flex-end; margin-bottom: 2px;
  }

  .date-divider {
    text-align: center; margin: 14px 0; position: relative;
  }

  .date-divider span {
    font-size: .72rem; font-weight: 700; color: var(--text2);
    background: var(--bg); padding: 0 12px; position: relative; z-index: 1;
  }

  .date-divider::before {
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: rgba(255,255,255,.07);
  }

  /* ── INPUT BAR ── */
  .input-bar {
    padding: 14px 18px;
    background: rgba(26,25,40,.9);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }

  .input-inner {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface2);
    border-radius: 18px; padding: 8px 14px;
    border: 1.5px solid rgba(255,255,255,.06);
    transition: border-color .2s;
  }

  .input-inner:focus-within { border-color: var(--c4); }

  #msg-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: 'Nunito', sans-serif; font-size: .95rem;
    resize: none; max-height: 120px; line-height: 1.5;
  }

  #msg-input::placeholder { color: var(--text2); }

  .emoji-btn, .send-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1.3rem; padding: 4px;
    transition: transform .15s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .emoji-btn:hover, .send-btn:hover { transform: scale(1.2); }

  .send-btn {
    background: linear-gradient(135deg, var(--c4), var(--c5));
    border-radius: 12px; padding: 8px 10px; font-size: 1rem;
    box-shadow: 0 4px 12px rgba(77,150,255,.3);
  }

  /* ── EMOJI PICKER ── */
  .emoji-picker {
    position: absolute; bottom: 74px; left: 50%;
    transform: translateX(-50%);
    background: var(--surface); border-radius: 18px;
    padding: 14px; display: none;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    z-index: 50; width: 320px;
    animation: slideUp .2s cubic-bezier(.16,1,.3,1);
  }

  .emoji-picker.open { display: block; }

  .emoji-picker-grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
  }

  .ep-emoji {
    font-size: 1.4rem; padding: 6px; border-radius: 8px;
    cursor: pointer; text-align: center; transition: background .15s;
    border: none; background: none;
  }

  .ep-emoji:hover { background: rgba(255,255,255,.1); transform: scale(1.2); }

  /* ── PROFILE MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(6px); padding: 20px;
  }

  .modal-overlay.hidden { display: none; }

  .modal {
    background: var(--surface); border-radius: 24px; padding: 32px 28px;
    width: 100%; max-width: 340px;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: slideUp .3s cubic-bezier(.16,1,.3,1);
  }

  .modal h3 { font-size: 1.2rem; font-weight: 900; margin-bottom: 20px; }

  .modal-avatar-big {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--surface2); font-size: 2.8rem;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; position: relative;
  }

  .modal-name { text-align: center; font-size: 1.3rem; font-weight: 900; margin-bottom: 4px; }
  .modal-status { text-align: center; font-size: .85rem; color: var(--text2); margin-bottom: 24px; }

  .modal-actions { display: flex; gap: 10px; flex-direction: column; }

  .btn-sec {
    padding: 11px; background: var(--surface2); border: 1.5px solid rgba(255,255,255,.08);
    border-radius: 12px; color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: .9rem; font-weight: 700; cursor: pointer; transition: all .2s;
  }

  .btn-sec:hover { background: rgba(255,255,255,.08); }

  .btn-danger {
    padding: 11px; background: rgba(255,107,107,.15); border: 1.5px solid rgba(255,107,107,.3);
    border-radius: 12px; color: var(--c1); font-family: 'Nunito', sans-serif;
    font-size: .9rem; font-weight: 700; cursor: pointer; transition: all .2s;
  }

  .btn-danger:hover { background: rgba(255,107,107,.25); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border-radius: 12px; padding: 12px 20px;
    font-size: .88rem; font-weight: 700; color: var(--text);
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
    transition: transform .3s cubic-bezier(.16,1,.3,1);
    z-index: 300; white-space: nowrap;
    border: 1px solid rgba(255,255,255,.1);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── MOBILE ── */
  @media (max-width: 640px) {
    .sidebar { width: 100%; min-width: 0; position: fixed; inset: 0; z-index: 10; transition: transform .3s; }
    .sidebar.hidden-mobile { transform: translateX(-100%); }
    .chat-area { width: 100%; }
    .back-btn { display: flex !important; }
    .msg-bubble { max-width: 80%; }
  }

  .back-btn {
    display: none; background: none; border: none; color: var(--text);
    font-size: 1.4rem; cursor: pointer; padding: 4px; margin-right: -6px;
  }

  .typing-indicator {
    display: flex; gap: 4px; align-items: center; padding: 10px 16px;
    background: var(--surface2); border-radius: 18px; border-bottom-left-radius: 5px;
    width: fit-content;
  }

  .typing-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--text2);
    animation: typingBounce 1.2s infinite ease-in-out;
  }

  .typing-dot:nth-child(2) { animation-delay: .2s; }
  .typing-dot:nth-child(3) { animation-delay: .4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Color strips for avatars */
  .av-color-0 { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }
  .av-color-1 { background: linear-gradient(135deg, #4D96FF, #6BCB77); }
  .av-color-2 { background: linear-gradient(135deg, #C77DFF, #FF6B6B); }
  .av-color-3 { background: linear-gradient(135deg, #FFD93D, #FF6B6B); }
  .av-color-4 { background: linear-gradient(135deg, #6BCB77, #4D96FF); }
  .av-color-5 { background: linear-gradient(135deg, #FF6B9D, #C77DFF); }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">ZipChat 💬</div>
    <p class="auth-sub">Arkadaşlarınla özel sohbet et!</p>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Giriş Yap</button>
      <button class="auth-tab" onclick="switchTab('register')">Kayıt Ol</button>
    </div>

    <div id="login-form">
      <div class="form-group">
        <label>E-posta</label>
        <input type="email" id="login-email" placeholder="ornek@mail.com">
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="doLogin()">🚀 Giriş Yap</button>
    </div>

    <div id="register-form" style="display:none">
      <div class="form-group">
        <label>Kullanıcı Adı</label>
        <input type="text" id="reg-username" placeholder="HavalıKullanıcı">
      </div>
      <div class="form-group">
        <label>Avatar Seç</label>
        <div class="avatar-picker" id="avatar-picker">
          <div class="av-opt selected" data-emoji="🦊" onclick="selectAvatar(this)">🦊</div>
          <div class="av-opt" data-emoji="🐼" onclick="selectAvatar(this)">🐼</div>
          <div class="av-opt" data-emoji="🦁" onclick="selectAvatar(this)">🦁</div>
          <div class="av-opt" data-emoji="🐸" onclick="selectAvatar(this)">🐸</div>
          <div class="av-opt" data-emoji="🦋" onclick="selectAvatar(this)">🦋</div>
          <div class="av-opt" data-emoji="🐉" onclick="selectAvatar(this)">🐉</div>
          <div class="av-opt" data-emoji="🌙" onclick="selectAvatar(this)">🌙</div>
          <div class="av-opt" data-emoji="⚡" onclick="selectAvatar(this)">⚡</div>
        </div>
      </div>
      <div class="form-group">
        <label>E-posta</label>
        <input type="email" id="reg-email" placeholder="ornek@mail.com">
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="reg-password" placeholder="En az 6 karakter">
      </div>
      <button class="btn-primary" onclick="doRegister()">✨ Hesap Oluştur</button>
    </div>

    <div id="auth-error"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">ZipChat 💬</div>
    </div>

    <div class="my-profile" onclick="openProfileModal()">
      <div class="avatar sm av-color-1" id="my-avatar-sidebar">🦊
        <div class="status-dot" id="my-status-dot"></div>
      </div>
      <div class="profile-info">
        <div class="profile-name" id="my-name-sidebar">Sen</div>
        <div class="profile-status" id="my-status-sidebar">Çevrimiçi</div>
      </div>
    </div>

    <div class="sidebar-section">Kullanıcılar</div>
    <div class="users-list" id="users-list">
      <div class="no-users">
        Henüz başka kullanıcı yok.<br>Arkadaşlarına bu sayfayı gönder!
      </div>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chat-area">
    <div class="chat-placeholder" id="chat-placeholder">
      <div class="big-emoji">💬</div>
      <p>Bir sohbet seç</p>
      <span>Sol taraftan arkadaşını seç</span>
    </div>

    <div id="chat-main" style="display:none; flex-direction:column; height:100%; overflow:hidden; display:none">
      <div class="chat-header">
        <button class="back-btn" onclick="closeMobileChat()">←</button>
        <div class="avatar lg" id="chat-peer-avatar">🐼
          <div class="status-dot" id="chat-peer-dot"></div>
        </div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chat-peer-name">Ad Soyad</div>
          <div class="chat-header-status" id="chat-peer-status">çevrimdışı</div>
        </div>
      </div>

      <div class="messages-container" id="messages-container"></div>

      <div style="position:relative">
        <div class="emoji-picker" id="emoji-picker">
          <div class="emoji-picker-grid" id="emoji-grid"></div>
        </div>
        <div class="input-bar">
          <div class="input-inner">
            <button class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
            <textarea id="msg-input" rows="1" placeholder="Bir şeyler yaz..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal-overlay hidden" id="profile-modal">
  <div class="modal">
    <h3>👤 Profil</h3>
    <div class="modal-avatar-big" id="modal-avatar">🦊</div>
    <div class="modal-name" id="modal-name">Kullanıcı</div>
    <div class="modal-status" id="modal-status">Çevrimiçi ✅</div>
    <div class="modal-actions">
      <button class="btn-sec" onclick="closeProfileModal()">Kapat</button>
      <button class="btn-danger" onclick="doLogout()">🚪 Çıkış Yap</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut, onAuthStateChanged, updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getDatabase, ref, set, get, onValue, push, serverTimestamp,
    off, update, onDisconnect, child
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  /* ══════════════════════════════════════════════
     🔥 FIREBASE CONFIG — buraya kendi config'ini gir
     https://console.firebase.google.com → Proje Ayarları → Web Uygulaması Ekle
  ══════════════════════════════════════════════ */
  const firebaseConfig = {
    apiKey:            "AIzaSyDLJ7uJ6TuQlyYOupEE5CMV8zutl6ZtapM",
    authDomain:        "zigchat-7cd60.firebaseapp.com",
    databaseURL:       "https://zigchat-7cd60-default-rtdb.us-central1.firebasedatabase.app",
    projectId:         "zigchat-7cd60",
    storageBucket:     "zigchat-7cd60.firebasestorage.app",
    messagingSenderId: "318192916333",
    appId:             "1:318192916333:web:dec581ec557c7e84096c64"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getDatabase(app);

  // ── State ──
  let currentUser = null;
  let selectedAvatar = '🦊';
  let activePeerId = null;
  let activePeerData = null;
  let messagesUnsubscribe = null;
  let usersUnsubscribe = null;
  let typingTimeout = null;

  const EMOJIS = ['😀','😂','🥰','😎','🤩','😜','🤔','😱','🥳','😴','😤','🤗','👍','❤️','🔥','✨','🎉','🙌','👀','💪','🚀','⚡','🌈','🎵','🍕','🎮','💡','🦊','🐼','🦁','🐸','🦋'];

  // ── Expose to global ──
  window.switchTab    = switchTab;
  window.selectAvatar = selectAvatar;
  window.doLogin      = doLogin;
  window.doRegister   = doRegister;
  window.doLogout     = doLogout;
  window.sendMessage  = sendMessage;
  window.handleKey    = handleKey;
  window.autoResize   = autoResize;
  window.toggleEmojiPicker = toggleEmojiPicker;
  window.openProfileModal  = openProfileModal;
  window.closeProfileModal = closeProfileModal;
  window.closeMobileChat   = closeMobileChat;

  // ── Auth state ──
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      setupApp();
    } else {
      currentUser = null;
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app').classList.remove('visible');
      if (usersUnsubscribe) { off(ref(db, 'users')); usersUnsubscribe = null; }
    }
  });

  function setupApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');

    // Update sidebar
    const displayName = currentUser.displayName || 'Sen';
    const parts = displayName.split('|');
    const username = parts[0] || displayName;
    const avatar   = parts[1] || '🦊';

    document.getElementById('my-name-sidebar').textContent = username;
    document.getElementById('my-avatar-sidebar').childNodes[0].textContent = avatar;

    // Set online presence
    const userRef = ref(db, `users/${currentUser.uid}`);
    set(userRef, { username, avatar, online: true, lastSeen: serverTimestamp() });
    onDisconnect(userRef).update({ online: false, lastSeen: serverTimestamp() });

    // Modal info
    document.getElementById('modal-avatar').textContent = avatar;
    document.getElementById('modal-name').textContent   = username;
    document.getElementById('modal-status').textContent = 'Çevrimiçi ✅';

    // Build emoji picker
    const grid = document.getElementById('emoji-grid');
    grid.innerHTML = '';
    EMOJIS.forEach(e => {
      const btn = document.createElement('button');
      btn.className = 'ep-emoji';
      btn.textContent = e;
      btn.onclick = () => { insertEmoji(e); };
      grid.appendChild(btn);
    });

    listenUsers();
  }

  function listenUsers() {
    const usersRef = ref(db, 'users');
    onValue(usersRef, snap => {
      const data = snap.val() || {};
      renderUsers(data);
      // Update active peer status
      if (activePeerId && data[activePeerId]) {
        updatePeerStatus(data[activePeerId]);
      }
    });
  }

  const colorClasses = ['av-color-0','av-color-1','av-color-2','av-color-3','av-color-4','av-color-5'];
  function getColorClass(uid) {
    let hash = 0;
    for (let c of uid) hash = ((hash << 5) - hash) + c.charCodeAt(0);
    return colorClasses[Math.abs(hash) % colorClasses.length];
  }

  function renderUsers(data) {
    const list = document.getElementById('users-list');
    const others = Object.entries(data).filter(([uid]) => uid !== currentUser.uid);
    if (!others.length) {
      list.innerHTML = '<div class="no-users">Henüz başka kullanıcı yok.<br>Arkadaşlarına bu sayfayı gönder!</div>';
      return;
    }
    list.innerHTML = '';
    others.forEach(([uid, u]) => {
      const div = document.createElement('div');
      div.className = 'user-item' + (uid === activePeerId ? ' active' : '');
      div.innerHTML = `
        <div class="avatar sm ${getColorClass(uid)}">
          ${u.avatar || '👤'}
          <div class="status-dot ${u.online ? '' : 'offline'}"></div>
        </div>
        <div class="profile-info">
          <div class="profile-name">${u.username}</div>
          <div class="profile-status" style="color:${u.online ? 'var(--c3)' : 'var(--text2)'}">
            ${u.online ? '● Çevrimiçi' : '○ Çevrimdışı'}
          </div>
        </div>`;
      div.onclick = () => openChat(uid, u);
      list.appendChild(div);
    });
  }

  function openChat(uid, userData) {
    activePeerId   = uid;
    activePeerData = userData;

    // UI
    document.getElementById('chat-peer-avatar').childNodes[0].textContent = userData.avatar || '👤';
    document.getElementById('chat-peer-name').textContent   = userData.username;
    updatePeerStatus(userData);

    document.getElementById('chat-placeholder').style.display = 'none';
    const cm = document.getElementById('chat-main');
    cm.style.display = 'flex';

    // Mobile: hide sidebar
    document.getElementById('sidebar').classList.add('hidden-mobile');

    // Mark active
    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
    event?.currentTarget?.classList.add('active');

    listenMessages();
  }

  function updatePeerStatus(u) {
    const dot    = document.getElementById('chat-peer-dot');
    const status = document.getElementById('chat-peer-status');
    if (u.online) {
      dot.className = 'status-dot';
      status.textContent = 'Çevrimiçi';
      status.className = 'chat-header-status online';
    } else {
      dot.className = 'status-dot offline';
      status.textContent = 'Çevrimdışı';
      status.className = 'chat-header-status';
    }
  }

  function getChatId(a, b) {
    return [a, b].sort().join('_');
  }

  function listenMessages() {
    if (messagesUnsubscribe) {
      off(ref(db, `messages/${getChatId(currentUser.uid, activePeerId)}`));
    }
    const msgRef = ref(db, `messages/${getChatId(currentUser.uid, activePeerId)}`);
    onValue(msgRef, snap => {
      const data = snap.val() || {};
      renderMessages(data);
    });
  }

  function renderMessages(data) {
    const container = document.getElementById('messages-container');
    const msgs = Object.values(data).sort((a,b) => a.ts - b.ts);

    container.innerHTML = '';
    let lastDate = '';

    msgs.forEach(msg => {
      const date = msg.ts ? new Date(msg.ts).toLocaleDateString('tr-TR', { day:'numeric', month:'long' }) : '';
      if (date && date !== lastDate) {
        const div = document.createElement('div');
        div.className = 'date-divider';
        div.innerHTML = `<span>${date}</span>`;
        container.appendChild(div);
        lastDate = date;
      }

      const mine = msg.uid === currentUser.uid;
      const row  = document.createElement('div');
      row.className = `msg-row ${mine ? 'mine' : 'theirs'}`;
      const time = msg.ts ? new Date(msg.ts).toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' }) : '';

      row.innerHTML = `
        ${!mine ? `<div class="avatar sm ${getColorClass(activePeerId)}" style="flex-shrink:0">${activePeerData?.avatar || '👤'}</div>` : ''}
        <div class="msg-bubble">${escapeHtml(msg.text)}</div>
        <div class="msg-time">${time}</div>`;
      container.appendChild(row);
    });

    container.scrollTop = container.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text  = input.value.trim();
    if (!text || !activePeerId) return;

    const chatId = getChatId(currentUser.uid, activePeerId);
    const msgRef = push(ref(db, `messages/${chatId}`));
    await set(msgRef, { uid: currentUser.uid, text, ts: Date.now() });

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('emoji-picker').classList.remove('open');
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function toggleEmojiPicker() {
    document.getElementById('emoji-picker').classList.toggle('open');
  }

  function insertEmoji(e) {
    const input = document.getElementById('msg-input');
    const pos = input.selectionStart || input.value.length;
    input.value = input.value.slice(0,pos) + e + input.value.slice(pos);
    input.focus();
    document.getElementById('emoji-picker').classList.remove('open');
  }

  function openProfileModal() {
    document.getElementById('profile-modal').classList.remove('hidden');
  }

  function closeProfileModal() {
    document.getElementById('profile-modal').classList.add('hidden');
  }

  async function doLogout() {
    const userRef = ref(db, `users/${currentUser.uid}`);
    await update(userRef, { online: false, lastSeen: serverTimestamp() });
    await signOut(auth);
    closeProfileModal();
    showToast('Çıkış yapıldı 👋');
  }

  function closeMobileChat() {
    document.getElementById('sidebar').classList.remove('hidden-mobile');
  }

  // ── AUTH ──
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0) === (tab==='login')));
    document.getElementById('login-form').style.display    = tab === 'login'    ? 'block' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('auth-error').textContent = '';
  }

  function selectAvatar(el) {
    document.querySelectorAll('.av-opt').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
    selectedAvatar = el.dataset.emoji;
  }

  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;
    if (!email || !pass) return setError('Lütfen tüm alanları doldur.');
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      showToast('Hoş geldin! 🎉');
    } catch(e) { setError(getFirebaseError(e.code)); }
  }

  async function doRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const pass     = document.getElementById('reg-password').value;
    if (!username || !email || !pass) return setError('Lütfen tüm alanları doldur.');
    if (pass.length < 6) return setError('Şifre en az 6 karakter olmalı.');
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: `${username}|${selectedAvatar}` });
      showToast('Hesap oluşturuldu! ✨');
    } catch(e) { setError(getFirebaseError(e.code)); }
  }

  function setError(msg) {
    document.getElementById('auth-error').textContent = msg;
  }

  function getFirebaseError(code) {
    const map = {
      'auth/email-already-in-use': 'Bu e-posta zaten kullanımda.',
      'auth/invalid-email': 'Geçersiz e-posta adresi.',
      'auth/wrong-password': 'Şifre yanlış.',
      'auth/user-not-found': 'Bu e-posta ile kayıtlı kullanıcı bulunamadı.',
      'auth/too-many-requests': 'Çok fazla deneme. Lütfen bekle.',
      'auth/invalid-credential': 'E-posta veya şifre hatalı.',
    };
    return map[code] || 'Bir hata oluştu: ' + code;
  }

  // ── Toast ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // Close emoji picker on outside click
  document.addEventListener('click', e => {
    const picker = document.getElementById('emoji-picker');
    if (!picker.contains(e.target) && !e.target.closest('.emoji-btn')) {
      picker.classList.remove('open');
    }
  });
</script>
</body>
</html>
